name: Build SongWave IPA (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure YouTube API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('SongWave/AppConfig.swift')
          s = p.read_text()
          key = os.environ.get('YOUTUBE_API_KEY', '')
          s = s.replace('static let youtubeAPIKey = ""', 'static let youtubeAPIKey = "' + key.replace('\\', '\\\\').replace('"', '\\"') + '"')
          p.write_text(s)
          PY

      - name: Archive app (no code signing)
        env:
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          BID="${BUNDLE_ID:-com.example.SongWave}"
          xcodebuild -project SongWave.xcodeproj -scheme SongWave -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SongWave.xcarchive" archive \
            PRODUCT_BUNDLE_IDENTIFIER="$BID" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/SongWave.xcarchive/Products/Applications/SongWave.app"
          test -d "$APP" || { echo "SongWave.app not found in archive" >&2; exit 1; }
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload" output
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/output/SongWave.ipa" Payload)
          ls -lh output/SongWave.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SongWave-IPA
          path: output/SongWave.ipa
          if-no-files-found: error
          retention-days: 14
